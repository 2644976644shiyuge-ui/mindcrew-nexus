# ═══════════════════════════════════════════════════════════════════
# Nginx 配置 · 前端静态托管 + 反向代理后端 + WebSocket 转发
# ═══════════════════════════════════════════════════════════════════

# WebSocket Upgrade 头映射（仅在 ws 升级请求时设值）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  _;
    charset      utf-8;

    # Docker Compose 中 backend 容器重建后 IP 会变化。
    # 使用 Docker 内置 DNS + 变量 proxy_pass，避免 nginx 启动时解析到旧 IP 导致 /api 全部 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8080;

    root   /usr/share/nginx/html;
    index  index.html;

    # index.html 强制不缓存 · 每次访问拉取最新版本拿到新 chunk hash
    # （避免发版后浏览器仍用旧 index.html 引用旧 chunk 导致新代码不生效）
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    # 上传 500MB（与后端 multipart 上限对齐，任务 58 长视频）
    client_max_body_size 1300m;
    client_body_buffer_size 1m;

    # 启用 Gzip 压缩
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 静态资源缓存（哈希文件名 1 年）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # AudioWorklet 等 public 目录脚本必须实时刷新
    location /voice/ {
        add_header Cache-Control "no-cache";
    }

    # ─── 语音通话 / ASR WebSocket（必须先于通用 /api/ 匹配） ───
    location ~ ^/api/(voice-call|speech)/ws {
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── 大文件上传（知识库 · 关闭请求缓冲，边传边转，缩短用户感知时间） ───
    location = /api/knowledge/upload {
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size      1300m;
        proxy_request_buffering   off;   # 不在 nginx 落盘缓冲整个请求体，直接流式转后端
        proxy_read_timeout        600s;
        proxy_send_timeout        600s;
    }

    # ─── PPT 生成与导出（外部排版服务是长任务） ───
    # 后端 Provider 最长 900s；这里额外预留失败回退到内置渲染器和文件传输时间。
    # 必须放在通用 /api/ 之前，避免被通用 600s 超时提前切断。
    location ~ ^/api/digital-employees/[0-9]+/(export/(pptx|deliverable)|deliverable/export)$ {
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering    off;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    # ─── 普通 API 反向代理 ───
    location /api/ {
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # SSE 流式输出
        proxy_buffering    off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;

        # 永久修复 502：后端冷启动/慢响应时不再立即返 502
        # · proxy_connect_timeout 300s：建立上游连接容忍 5 分钟（默认 60s 太短）
        # · proxy_next_upstream：连接失败/超时/5xx 时自动重试同一 upstream（最多 3 次）
        # · proxy_next_upstream_timeout 60s：本次请求总重试窗口 60s
        proxy_connect_timeout   300s;
        proxy_send_timeout      600s;
        proxy_next_upstream     error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries      3;
        proxy_next_upstream_timeout    60s;
    }

    # ─── 上传文件直链（如头像） ───
    location /uploads/ {
        proxy_pass         http://$backend_upstream;
        proxy_set_header   Host $host;
    }

    # ─── Vue Router history 模式 ───
    # index.html 必须 no-cache：/assets/ 带 hash 可永久缓存，但入口 html 每次都要重新校验，
    # 否则重建后浏览器仍拿旧 index.html → 指向旧 JS → 前端改动不生效（本项目反复踩坑的根因）。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ═══ 废弃的旧版 AI Office（GitHub React 应用）═══
    # 强制 404：避免 SPA fallback 误把浏览器缓存的旧 ai-office iframe 响应当成 Vue 页面渲染
    location /ai-office {
        return 404;
    }
}
